spring:
  application:
    name: jobtracker

  profiles:
    # Local runs seed demo data; production overrides with SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Managed Postgres (Neon) requires TLS — append ?sslmode=require to the URL.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/jobtracker}
    username: ${SPRING_DATASOURCE_USERNAME:jobtracker}
    password: ${SPRING_DATASOURCE_PASSWORD:jobtracker}

  jpa:
    hibernate:
      # Flyway owns the schema — never let Hibernate mutate it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Hosting platforms hand the port to the process; 8080 is only the fallback.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Health only. Everything else would describe the internals to anyone asking.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

jwt:
  # Dev-only default; override with JWT_SECRET in any real environment (min 32 bytes for HS256).
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-1234567890-abcdefghij}
  access-token-expiration: 900000       # 15 minutes
  refresh-token-expiration: 604800000   # 7 days

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    # Seeds the demo account and sample applications. On by default for `dev`;
    # production turns it on deliberately so a recruiter has something to look at.
    seed: ${APP_DEMO_SEED:false}
    # Wipes and re-seeds the demo account on a schedule, so a public demo stays
    # presentable no matter what visitors do to it. Disabled unless set.
    reset-cron: ${APP_DEMO_RESET_CRON:-}
