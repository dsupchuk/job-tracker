name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Covers the form engine, the board's optimistic updates, the auth
      # interceptor, accessibility (jest-axe) and the colour contrast audit.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # Integration tests start their own PostgreSQL through Testcontainers,
      # which needs the Docker daemon the runner already provides — no service
      # container and no credentials to keep in sync with `application.yml`.
      - name: Test
        run: ./mvnw --batch-mode verify

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # Only worth building once the change is actually on main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - name: Build the backend image
        run: docker build -f docker/backend.Dockerfile -t jobtracker-backend:${{ github.sha }} .
